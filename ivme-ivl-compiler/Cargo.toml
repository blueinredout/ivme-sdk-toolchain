[package]
name = "ivlc"
version = "0.1.0"
edition = "2021"
description = "Compiles TrenchBroom .map projects into .ivl archives for IVME"

[dependencies]
clap.workspace = true
colored.workspace = true
image.workspace = true
zip.workspace = true
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
serde_json = "1"
rsa = { version = "=0.10.0", features = ["pkcs1v15"] }
zeroize = "1"

[dev-dependencies]
image.workspace = true
base64 = "0.22"
